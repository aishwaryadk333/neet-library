<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEET Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --font-display:'Fraunces',serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --sidebar-w:248px; --sidebar-w-collapsed:68px;
  --shadow-1:0 1px 2px rgba(0,0,0,.35), 0 1px 1px rgba(0,0,0,.2);
  --shadow-2:0 8px 24px rgba(0,0,0,.45);
  --dur-1:120ms; --dur-2:220ms;
}

/* ---- Theme: Obsidian (default) ---- */
[data-theme="obsidian"]{
  --bg:#0b0b0d; --surface:#141418; --surface-2:#1b1b21; --surface-hover:#212128;
  --border:#28282f; --border-soft:#1e1e24;
  --text:#e7e5e1; --text-dim:#a3a1a0; --text-faint:#6f6d6f;
  --accent:#b7bec7; --accent-strong:#d7dce1; --accent-contrast:#0b0b0d;
  --gold:#9a9690;
  --success:#7fae8e; --danger:#c17c72; --warn:#c9a35f;
}
/* ---- Theme: Burgundy ---- */
[data-theme="burgundy"]{
  --bg:#160a0d; --surface:#1f0f13; --surface-2:#28151a; --surface-hover:#331a20;
  --border:#3a1e24; --border-soft:#2a161b;
  --text:#efe6e0; --text-dim:#b89e9a; --text-faint:#7d6461;
  --accent:#a5493f; --accent-strong:#c65c4f; --accent-contrast:#fdf1ee;
  --gold:#b08a4e;
  --success:#7fae8e; --danger:#c65c4f; --warn:#c9a35f;
}
/* ---- Theme: Espresso ---- */
[data-theme="espresso"]{
  --bg:#160f0b; --surface:#20160f; --surface-2:#291d14; --surface-hover:#33251a;
  --border:#3c2c1e; --border-soft:#2a1e14;
  --text:#efe3d3; --text-dim:#bfa78e; --text-faint:#8a765f;
  --accent:#c08a4e; --accent-strong:#d9a566; --accent-contrast:#1a1108;
  --gold:#c9a35f;
  --success:#8fae7f; --danger:#c17257; --warn:#c9a35f;
}
/* ---- Theme: Forest ---- */
[data-theme="forest"]{
  --bg:#0b1310; --surface:#111c17; --surface-2:#17251f; --surface-hover:#1e2f27;
  --border:#243a30; --border-soft:#182a22;
  --text:#e5ece5; --text-dim:#a3b8a9; --text-faint:#6e8175;
  --accent:#6f9c7c; --accent-strong:#8ab896; --accent-contrast:#0b1310;
  --gold:#b0a05a;
  --success:#8ab896; --danger:#c17c72; --warn:#c9a35f;
}
/* ---- Theme: Midnight ---- */
[data-theme="midnight"]{
  --bg:#0a0d16; --surface:#111524; --surface-2:#161c2f; --surface-hover:#1c2439;
  --border:#26314d; --border-soft:#1a2338;
  --text:#e4e7f0; --text-dim:#9ba3c0; --text-faint:#666e91;
  --accent:#6c86c2; --accent-strong:#8ba0d4; --accent-contrast:#0a0d16;
  --gold:#a4a377;
  --success:#7fae9c; --danger:#c17c72; --warn:#c9a35f;
}
/* ---- Theme: Dark Academia ---- */
[data-theme="academia"]{
  --bg:#141210; --surface:#1c1916; --surface-2:#24201c; --surface-hover:#2c2721;
  --border:#3a332a; --border-soft:#28231d;
  --text:#ece4d3; --text-dim:#b6a98e; --text-faint:#847a63;
  --accent:#9c8a4e; --accent-strong:#bfa662; --accent-contrast:#141210;
  --gold:#bfa662;
  --success:#8fae7f; --danger:#b76a5c; --warn:#c9a35f;
}
/* ---- Theme: Parchment (light) ---- */
[data-theme="parchment"]{
  --bg:#f3ecdb; --surface:#fffcf5; --surface-2:#f0e6cd; --surface-hover:#e8dab6;
  --border:#d9c8a2; --border-soft:#e6d7b6;
  --text:#2e2417; --text-dim:#6d5b3e; --text-faint:#9c8a68;
  --accent:#8a5a34; --accent-strong:#6e4526; --accent-contrast:#fffaf0;
  --gold:#a9772f;
  --success:#4d7f5c; --danger:#a34b3f; --warn:#a9772f;
}
/* ---- Theme: Ivory (light) ---- */
[data-theme="ivory"]{
  --bg:#f6f6f3; --surface:#ffffff; --surface-2:#eeeeea; --surface-hover:#e4e4de;
  --border:#d6d6cd; --border-soft:#e2e2da;
  --text:#232320; --text-dim:#5c5c54; --text-faint:#8c8c80;
  --accent:#3d4a5c; --accent-strong:#2a3441; --accent-contrast:#ffffff;
  --gold:#96814a;
  --success:#3f7d54; --danger:#a3453b; --warn:#a9772f;
}
/* ---- Theme: Sage Linen (light) ---- */
[data-theme="sage-linen"]{
  --bg:#f0f2e6; --surface:#fbfcf7; --surface-2:#e6ead6; --surface-hover:#dae1c4;
  --border:#c7d0a9; --border-soft:#dbe2c2;
  --text:#26301f; --text-dim:#5b6b4a; --text-faint:#8a9878;
  --accent:#57724a; --accent-strong:#425939; --accent-contrast:#fbfcf7;
  --gold:#8a7a3d;
  --success:#4a7d55; --danger:#a04a3f; --warn:#a9772f;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
::selection{ background:var(--accent); color:var(--accent-contrast); }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }
a{ color:inherit; }
button{ font-family:inherit; }

[data-density="compact"] { --pad-unit: 6px; --row-h: 30px; }
[data-density="comfortable"] { --pad-unit: 10px; --row-h: 38px; }

/* ============================= LAYOUT ============================= */
.app-shell{ display:grid; grid-template-columns:var(--sidebar-w) 1fr; height:100vh; transition:grid-template-columns var(--dur-2) ease; }
.app-shell.collapsed{ grid-template-columns:var(--sidebar-w-collapsed) 1fr; }

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--surface); border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column; overflow:hidden; min-width:0;
}
.sidebar-header{
  display:flex; align-items:center; gap:10px; padding:18px 16px 14px 18px;
  border-bottom:1px solid var(--border-soft); flex-shrink:0; min-height:64px;
}
.brand-mark{
  width:30px; height:30px; border-radius:8px; flex-shrink:0;
  background:linear-gradient(155deg, var(--accent), var(--gold));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:600; font-size:15px; color:var(--accent-contrast);
}
.brand-text{ font-family:var(--font-display); font-weight:600; font-size:17px; white-space:nowrap; letter-spacing:.2px; }
.app-shell.collapsed .brand-text, .app-shell.collapsed .sidebar-footer-text{ display:none; }

.sidebar-scroll{ flex:1; overflow-y:auto; padding:14px 10px 14px 10px; }
.nav-group{ margin-bottom:16px; }
.nav-group-label{
  font-size:11px; color:var(--text-faint); padding:0 10px 6px 10px; font-weight:500;
  letter-spacing:.4px; white-space:nowrap;
}
.app-shell.collapsed .nav-group-label{ display:none; }
.nav-item{
  display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:var(--radius-sm);
  cursor:pointer; color:var(--text-dim); font-size:13.5px; white-space:nowrap; overflow:hidden;
  transition:background var(--dur-1) ease, color var(--dur-1) ease; user-select:none;
  border:1px solid transparent;
}
.nav-item:hover{ background:var(--surface-hover); color:var(--text); }
.nav-item.active{ background:var(--surface-2); color:var(--text); border-color:var(--border); }
.nav-item.active .nav-ico{ color:var(--accent-strong); }
.nav-ico{ width:17px; height:17px; flex-shrink:0; opacity:.85; }
.nav-item .nav-count{ margin-left:auto; font-size:11px; color:var(--text-faint); }

.sidebar-footer{
  border-top:1px solid var(--border-soft); padding:12px 14px; flex-shrink:0;
  display:flex; align-items:center; gap:9px;
}
.autosave-dot{ width:7px; height:7px; border-radius:50%; background:var(--success); flex-shrink:0; transition:background var(--dur-1); }
.autosave-dot.saving{ background:var(--warn); animation:pulse 1s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
.sidebar-footer-text{ font-size:11.5px; color:var(--text-faint); white-space:nowrap; }
.collapse-btn{
  margin-left:auto; width:24px; height:24px; border-radius:6px; border:none; background:transparent;
  color:var(--text-faint); cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.collapse-btn:hover{ background:var(--surface-hover); color:var(--text); }

/* ---------- Main ---------- */
.main{ display:flex; flex-direction:column; min-width:0; height:100vh; }
.topbar{
  height:64px; flex-shrink:0; display:flex; align-items:center; gap:14px;
  padding:0 24px; border-bottom:1px solid var(--border-soft); background:var(--bg);
}
.breadcrumb{ font-size:13px; color:var(--text-dim); display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; }
.breadcrumb b{ color:var(--text); font-weight:500; }
.breadcrumb .sep{ color:var(--text-faint); }
.topbar-search{
  flex:1; max-width:420px; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:8px 12px; color:var(--text-dim); cursor:pointer; transition:border-color var(--dur-1);
}
.topbar-search:hover{ border-color:var(--text-faint); }
.topbar-search svg{ width:15px; height:15px; flex-shrink:0; opacity:.7; }
.topbar-search span{ font-size:13px; }
.kbd{ margin-left:auto; font-size:10.5px; border:1px solid var(--border); border-radius:4px; padding:1px 5px; color:var(--text-faint); }
.topbar-actions{ display:flex; align-items:center; gap:10px; margin-left:auto; }

.icon-btn{
  width:34px; height:34px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all var(--dur-1) ease; flex-shrink:0;
}
.icon-btn:hover{ background:var(--surface-hover); color:var(--text); }
.icon-btn svg{ width:16px; height:16px; }

.content{ flex:1; overflow-y:auto; padding:28px 32px 60px 32px; }
.page-header{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap; }
.page-title{ font-family:var(--font-display); font-size:26px; font-weight:600; letter-spacing:.1px; }
.page-sub{ color:var(--text-dim); font-size:13px; margin-top:4px; }
.page-actions{ display:flex; gap:10px; }

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13px;
  font-weight:500; cursor:pointer; transition:all var(--dur-1) ease; white-space:nowrap;
}
.btn svg{ width:14px; height:14px; }
.btn:hover{ background:var(--surface-hover); }
.btn-primary{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); }
.btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
.btn-danger{ color:var(--danger); }
.btn-danger:hover{ background:rgba(193,124,114,.12); }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:var(--surface-hover); }
.btn-sm{ padding:5px 10px; font-size:12px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* ============================= CARDS / GRID ============================= */
.folder-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; margin-bottom:30px; }
.folder-card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md);
  padding:16px; cursor:pointer; transition:all var(--dur-1) ease; display:flex; flex-direction:column; gap:10px;
}
.folder-card:hover{ border-color:var(--border); background:var(--surface-2); transform:translateY(-1px); box-shadow:var(--shadow-1); }
.folder-card .f-ico{
  width:34px; height:34px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center;
  color:var(--accent-strong);
}
.folder-card .f-ico svg{ width:17px; height:17px; }
.folder-card .f-name{ font-size:13.5px; font-weight:500; }
.folder-card .f-count{ font-size:11.5px; color:var(--text-faint); }

.section-label{ font-size:12px; text-transform:none; color:var(--text-faint); font-weight:500; margin:26px 0 12px 0; letter-spacing:.2px; }
.section-label:first-child{ margin-top:0; }

.resource-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
.resource-card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md);
  padding:14px; display:flex; flex-direction:column; gap:9px; transition:all var(--dur-1) ease; cursor:pointer;
  position:relative;
}
.resource-card:hover{ border-color:var(--border); box-shadow:var(--shadow-1); background:var(--surface-2); }
.rc-top{ display:flex; align-items:flex-start; gap:10px; }
.rc-ico{ width:30px; height:30px; border-radius:7px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--accent-strong); }
.rc-ico svg{ width:15px; height:15px; }
.rc-name{ font-size:13px; font-weight:500; line-height:1.35; flex:1; }
.rc-meta{ font-size:11px; color:var(--text-faint); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.rc-tags{ display:flex; gap:5px; flex-wrap:wrap; }
.tag-chip{ font-size:10.5px; padding:2px 7px; border-radius:20px; background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border-soft); }
.rc-star{
  position:absolute; top:12px; right:12px; width:22px; height:22px; border-radius:6px; border:none; background:transparent;
  color:var(--text-faint); cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.rc-star:hover{ background:var(--surface-2); color:var(--gold); }
.rc-star.active{ color:var(--gold); }
.rc-star svg{ width:15px; height:15px; }
.rc-badge-ref{ font-size:9.5px; color:var(--text-faint); border:1px solid var(--border-soft); padding:1px 5px; border-radius:4px; }
.rc-actions{ display:none; gap:6px; margin-top:2px; flex-wrap:wrap; }
.resource-card:hover .rc-actions{ display:flex; }
.rc-mini-btn{ font-size:11px; color:var(--text-dim); background:var(--surface-2); border:1px solid var(--border-soft); border-radius:5px; padding:3px 8px; cursor:pointer; }
.rc-mini-btn:hover{ color:var(--text); border-color:var(--border); }

.empty-state{
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:60px 20px; color:var(--text-faint); gap:10px;
}
.empty-state svg{ width:34px; height:34px; opacity:.4; margin-bottom:6px; }
.empty-state h3{ font-family:var(--font-display); font-weight:500; font-size:16px; color:var(--text-dim); }
.empty-state p{ font-size:12.5px; max-width:320px; }

/* ============================= DASHBOARD ============================= */
.dash-grid{ display:grid; grid-template-columns:2fr 1fr; gap:20px; align-items:start; }
.dash-col{ display:flex; flex-direction:column; gap:20px; }
.panel{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:18px 18px 8px 18px; }
.panel-title{ font-family:var(--font-display); font-size:15px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }
.panel-title a{ font-family:var(--font-body); font-size:11.5px; color:var(--text-faint); font-weight:500; cursor:pointer; }
.panel-title a:hover{ color:var(--text-dim); }
.list-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border-soft); cursor:pointer; }
.list-row:last-child{ border-bottom:none; }
.list-row:hover .list-row-name{ color:var(--accent-strong); }
.list-row-ico{ width:26px; height:26px; border-radius:6px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--accent-strong); flex-shrink:0; }
.list-row-ico svg{ width:13px; height:13px; }
.list-row-name{ font-size:12.5px; flex:1; }
.list-row-sub{ font-size:11px; color:var(--text-faint); flex-shrink:0; }
.stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:10px; }
.stat-tile{ background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:12px 14px; }
.stat-num{ font-family:var(--font-display); font-size:22px; font-weight:600; }
.stat-lbl{ font-size:11px; color:var(--text-faint); margin-top:2px; }
.quick-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.quick-tile{ background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:14px 10px; text-align:center; cursor:pointer; transition:all var(--dur-1); }
.quick-tile:hover{ border-color:var(--border); background:var(--surface-hover); }
.quick-tile svg{ width:18px; height:18px; color:var(--accent-strong); margin-bottom:6px; }
.quick-tile-lbl{ font-size:11.5px; color:var(--text-dim); }

/* ============================= MODAL ============================= */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:200; opacity:0; pointer-events:none;
  transition:opacity var(--dur-2) ease;
}
.modal-overlay.open{ opacity:1; pointer-events:auto; }
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  width:460px; max-width:92vw; max-height:86vh; overflow-y:auto; box-shadow:var(--shadow-2);
  transform:translateY(6px) scale(.98); transition:transform var(--dur-2) ease;
}
.modal-overlay.open .modal{ transform:translateY(0) scale(1); }
.modal.wide{ width:600px; }
.modal-head{ padding:18px 20px; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; justify-content:space-between; }
.modal-head h3{ font-family:var(--font-display); font-size:16.5px; font-weight:600; }
.modal-close{ width:26px; height:26px; border-radius:6px; border:none; background:transparent; color:var(--text-faint); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.modal-close:hover{ background:var(--surface-hover); color:var(--text); }
.modal-body{ padding:18px 20px; display:flex; flex-direction:column; gap:14px; }
.modal-foot{ padding:14px 20px 18px 20px; display:flex; justify-content:flex-end; gap:10px; border-top:1px solid var(--border-soft); }

.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:12px; color:var(--text-dim); font-weight:500; }
.field-hint{ font-size:11px; color:var(--text-faint); }
.input, .select, textarea{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm);
  padding:9px 11px; font-size:13px; font-family:inherit; width:100%; transition:border-color var(--dur-1);
}
.input:focus, .select:focus, textarea:focus{ outline:none; border-color:var(--accent); }
textarea{ resize:vertical; min-height:60px; }
.type-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.type-opt{ display:flex; flex-direction:column; align-items:center; gap:5px; padding:9px 4px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-2); cursor:pointer; font-size:10.5px; color:var(--text-dim); }
.type-opt svg{ width:15px; height:15px; }
.type-opt.selected{ border-color:var(--accent); color:var(--text); background:var(--surface-hover); }
.tag-input-row{ display:flex; flex-wrap:wrap; gap:6px; padding:7px 9px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); }
.tag-input-row input{ border:none; background:transparent; outline:none; color:var(--text); font-size:12.5px; flex:1; min-width:80px; }
.tag-chip.removable{ display:flex; align-items:center; gap:4px; cursor:default; }
.tag-chip.removable button{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:12px; line-height:1; padding:0; }
.filepick-row{ display:flex; align-items:center; gap:10px; padding:10px; border:1px dashed var(--border); border-radius:var(--radius-sm); transition:all var(--dur-1); }
.filepick-row .filename{ font-size:12px; color:var(--text-dim); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.notice-box{ font-size:11.5px; color:var(--text-faint); background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:9px 11px; line-height:1.5; }
.notice-box.warn{ border-color:rgba(201,163,95,.4); }
.folder-select-tree{ max-height:220px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px; background:var(--surface-2); }
.folder-select-item{ padding:6px 9px; font-size:12.5px; border-radius:5px; cursor:pointer; color:var(--text-dim); }
.folder-select-item:hover{ background:var(--surface-hover); }
.folder-select-item.selected{ background:var(--accent); color:var(--accent-contrast); }
.folder-select-item.depth-1{ padding-left:22px; }
.folder-select-item.depth-2{ padding-left:36px; }

/* ============================= SEARCH OVERLAY ============================= */
.search-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:250; display:flex; align-items:flex-start; justify-content:center; padding-top:9vh; opacity:0; pointer-events:none; transition:opacity var(--dur-1); }
.search-overlay.open{ opacity:1; pointer-events:auto; }
.search-panel{ width:600px; max-width:92vw; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-2); max-height:70vh; display:flex; flex-direction:column; overflow:hidden; }
.search-input-row{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border-soft); }
.search-input-row svg{ width:17px; height:17px; color:var(--text-faint); flex-shrink:0; }
.search-input-row input{ flex:1; background:none; border:none; outline:none; color:var(--text); font-size:15px; font-family:inherit; }
.search-filters{ display:flex; gap:7px; padding:10px 16px; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
.filter-chip{ font-size:11px; padding:5px 10px; border-radius:20px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); cursor:pointer; }
.filter-chip.active{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); }
.search-results{ overflow-y:auto; padding:8px; flex:1; }
.search-result{ display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:var(--radius-sm); cursor:pointer; }
.search-result:hover{ background:var(--surface-hover); }
.search-result .sr-path{ font-size:10.5px; color:var(--text-faint); }

/* ============================= SETTINGS ============================= */
.settings-grid{ display:flex; flex-direction:column; gap:22px; max-width:640px; }
.settings-section{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:18px 20px; }
.settings-section h4{ font-family:var(--font-display); font-size:15px; font-weight:600; margin-bottom:14px; }
.settings-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border-soft); gap:16px; }
.settings-row:last-child{ border-bottom:none; }
.settings-row-label{ font-size:13px; }
.settings-row-desc{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }
.theme-swatches{ display:flex; flex-direction:column; }
.theme-group-label{ font-size:11px; color:var(--text-faint); font-weight:500; letter-spacing:.4px; margin:2px 0 8px 0; }
.theme-swatches-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
.theme-swatches-row:last-child{ margin-bottom:0; }
.theme-swatch{ border:1px solid var(--border); border-radius:var(--radius-md); padding:10px; cursor:pointer; display:flex; flex-direction:column; gap:8px; }
.theme-swatch.selected{ border-color:var(--accent); }
.swatch-preview{ height:34px; border-radius:6px; display:flex; overflow:hidden; }
.swatch-preview span{ flex:1; }
.theme-swatch-name{ font-size:11.5px; color:var(--text-dim); }
.toggle{ position:relative; width:38px; height:22px; border-radius:20px; background:var(--surface-2); border:1px solid var(--border); cursor:pointer; flex-shrink:0; }
.toggle::after{ content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--text-faint); transition:all var(--dur-1); }
.toggle.on{ background:var(--accent); border-color:var(--accent); }
.toggle.on::after{ left:18px; background:var(--accent-contrast); }
.segmented{ display:flex; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
.segmented button{ padding:6px 12px; font-size:12px; background:var(--surface-2); border:none; color:var(--text-dim); cursor:pointer; border-right:1px solid var(--border); }
.segmented button:last-child{ border-right:none; }
.segmented button.active{ background:var(--accent); color:var(--accent-contrast); }

/* ============================= REVISION COUNTS ============================= */
.rc-meta svg{ width:10px; height:10px; vertical-align:-1px; }

/* ============================= IMAGE PREVIEW ============================= */
#imagePreviewOverlay{ background:rgba(0,0,0,.85); }
.preview-shell{ position:relative; width:92vw; height:88vh; max-width:1100px; display:flex; flex-direction:column; }
.preview-topbar{ display:flex; align-items:center; justify-content:space-between; padding:4px 4px 12px 4px; flex-shrink:0; }
.preview-name{ font-size:13px; color:#f1f1ee; font-weight:500; }
.preview-topbar-actions{ display:flex; gap:8px; }
.preview-topbar-actions .icon-btn{ background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.15); color:#fff; }
.preview-topbar-actions .icon-btn:hover{ background:rgba(255,255,255,.18); }
.preview-topbar-actions .icon-btn.active{ color:var(--gold); }
.preview-body{ flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; min-height:0; }
.preview-body img{ max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 12px 40px rgba(0,0,0,.5); object-fit:contain; }
.preview-nav{ position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:2px; background:rgba(24,24,24,.75); backdrop-filter:blur(6px); border-radius:999px; padding:4px; box-shadow:0 6px 20px rgba(0,0,0,.4); }
.preview-nav-btn{ width:36px; height:36px; border-radius:50%; border:none; background:transparent; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background var(--dur-1); flex-shrink:0; }
.preview-nav-btn svg{ width:18px; height:18px; }
.preview-nav-btn:hover{ background:rgba(255,255,255,.16); }
.preview-nav-btn:disabled{ opacity:.28; cursor:not-allowed; }
.preview-nav-btn:disabled:hover{ background:transparent; }
.preview-nav-pos{ font-size:11px; color:rgba(255,255,255,.75); padding:0 10px; min-width:44px; text-align:center; flex-shrink:0; }

/* ============================= TOAST ============================= */
.toast-wrap{ position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:400; }
.toast{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 14px; font-size:12.5px; box-shadow:var(--shadow-2); display:flex; align-items:center; gap:8px; animation:toastIn var(--dur-2) ease; }
@keyframes toastIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

/* ============================= RESPONSIVE ============================= */
@media (max-width:880px){
  .app-shell{ grid-template-columns:0 1fr; }
  .app-shell:not(.mobile-open) .sidebar{ display:none; }
  .app-shell.mobile-open{ grid-template-columns:var(--sidebar-w) 1fr; }
  .dash-grid{ grid-template-columns:1fr; }
  .quick-grid{ grid-template-columns:repeat(2,1fr); }
  .content{ padding:20px 16px 50px 16px; }
  .topbar{ padding:0 14px; }
  .topbar-search span{ display:none; }
  .mobile-menu-btn{ display:flex !important; }
}
.mobile-menu-btn{ display:none; }

/* misc */
.hidden{ display:none !important; }
.small-note{ font-size:11px; color:var(--text-faint); }
.pathline{ font-size:11.5px; color:var(--text-faint); margin-top:-14px; margin-bottom:6px; }
</style>

/* ---------------------- DEFAULT LIBRARY TREE ---------------------- */
function defaultSubjectFolders(extra){
  return ['Notes','Short Notes','Mind Maps','PYQs',...extra,'Important'];
}
function buildDefaultTree(){
  const uidCounter = {n:0};
  function mk(name, icoKey, children){
    return {id:'f_'+(uidCounter.n++)+'_'+Math.random().toString(36).slice(2,7), name, custom:false, children: children||[]};
  }
  function leaf(name){ return mk(name, null, []); }

  const tree = [
    mk('NCERT', 'ncert', [
      mk('Physics', null, [ mk('Class 11', null, []), mk('Class 12', null, []) ]),
      mk('Chemistry', null, [ mk('Class 11', null, []), mk('Class 12', null, []) ]),
      mk('Biology', null, [ mk('Class 11', null, []), mk('Class 12', null, []) ]),
    ]),
    mk('Physics', 'physics', defaultSubjectFolders(['Formulae']).map(leaf)),
    mk('Chemistry', 'chemistry', defaultSubjectFolders(['Formulae & Reactions']).map(leaf)),
    mk('Botany', 'botany', defaultSubjectFolders(['Diagrams']).map(leaf)),
    mk('Zoology', 'zoology', defaultSubjectFolders(['Diagrams']).map(leaf)),
    mk('Mind Maps', 'mindmap', []),
    mk('NEET Strategies', 'strategy', ['Study Strategy','Revision Strategy','Test Strategy','Time Management','Exam Strategy'].map(leaf)),
  ];
  return tree;
}

/* ---------------------- STORAGE LAYER ----------------------
   Persists to the browser's own IndexedDB (works when this file is
   opened directly, double-clicked, or saved to disk — no external
   service required). Falls back to localStorage if IndexedDB is
   unavailable, and still uses window.storage first when present
   (e.g. inside the Claude artifact preview) so both contexts work. */
const STORE_KEY_DATA = 'app:data:v1';
const STORE_KEY_SETTINGS = 'app:settings:v1';
const SCHEMA_VERSION = 1;

const IDB_NAME = 'neet-library-db';
const IDB_VERSION = 1;
const IDB_STORE = 'kv';
let idbPromise = null;
function openIDB(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
    req.onblocked = ()=> reject(new Error('IndexedDB blocked'));
  });
  return idbPromise;
}
function idbPut(key, value){
  return openIDB().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  }));
}
function idbFetch(key){
  return openIDB().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  }));
}
function lsPut(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); return true; }catch(e){ return false; } }
function lsFetch(key){ try{ const v = localStorage.getItem(key); return v==null ? undefined : JSON.parse(v); }catch(e){ return undefined; } }

async function storageSet(key, value){
  // Prefer the host artifact's storage API when it's actually present.
  if(window.storage && typeof window.storage.set === 'function'){
    try{ await window.storage.set(key, JSON.stringify(value), false); return true; }
    catch(e){ console.warn('window.storage.set failed, falling back to IndexedDB', e); }
  }
  try{ await idbPut(key, value); return true; }
  catch(e){ console.warn('IndexedDB save failed, falling back to localStorage', e); }
  return lsPut(key, value);
}
async function storageGet(key){
  if(window.storage && typeof window.storage.get === 'function'){
    try{
      const r = await window.storage.get(key, false);
      if(r && r.value != null) return JSON.parse(r.value);
    }catch(e){ console.warn('window.storage.get failed, falling back to IndexedDB', e); }
  }
  try{
    const v = await idbFetch(key);
    if(v !== undefined) return v;
  }catch(e){ console.warn('IndexedDB read failed, falling back to localStorage', e); }
  return lsFetch(key);
}

let saveTimer = null;
let pendingSave = false;
function markSaving(){
  pendingSave = true;
  const dot = document.getElementById('autosaveDot');
  const txt = document.getElementById('autosaveText');
  dot.classList.add('saving');
  txt.textContent = 'Saving…';
}
function markSaved(){
  pendingSave = false;
  const dot = document.getElementById('autosaveDot');
  const txt = document.getElementById('autosaveText');
  dot.classList.remove('saving');
  txt.textContent = 'All changes saved';
}

async function persistData(){
  markSaving();
  try{
    await storageSet(STORE_KEY_DATA, DATA);
    markSaved();
  }catch(e){
    console.error('Save failed', e);
    document.getElementById('autosaveText').textContent = 'Save failed — retrying…';
    setTimeout(()=>persistData(), 1500);
  }
}
async function persistSettings(){
  markSaving();
  try{
    await storageSet(STORE_KEY_SETTINGS, SETTINGS);
    markSaved();
  }catch(e){
    console.error('Settings save failed', e);
  }
}
function scheduleSaveData(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>persistData(), 350);
}
function scheduleSaveSettings(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>persistSettings(), 250);
}
// Best-effort warning if the tab is closed mid-debounce, so a save in flight isn't silently dropped.
window.addEventListener('beforeunload', (e)=>{
  if(pendingSave){ e.preventDefault(); e.returnValue = ''; }
});

async function loadAll(){
  try{
    const d = await storageGet(STORE_KEY_DATA);
    DATA = d || defaultData();
  }catch(e){ DATA = defaultData(); }
  try{
    const s = await storageGet(STORE_KEY_SETTINGS);
    SETTINGS = s || defaultSettings();
  }catch(e){ SETTINGS = defaultSettings(); }
  // migrations placeholder
  if(!DATA.version) DATA.version = SCHEMA_VERSION;
  if(!SETTINGS.version) SETTINGS.version = SCHEMA_VERSION;
}

/* ---------------------- HELPERS ---------------------- */
function uid(){ return 'r_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function findFolder(id, nodes=DATA.tree, path=[]){
  for(const n of nodes){
    const p = [...path, n];
    if(n.id === id) return p;
    if(n.children && n.children.length){
      const found = findFolder(id, n.children, p);
      if(found) return found;
    }
  }
  return null;
}
function folderById(id, nodes=DATA.tree){
  for(const n of nodes){
    if(n.id === id) return n;
    if(n.children){ const f = folderById(id, n.children); if(f) return f; }
  }
  return null;
}
function allFolderIdsUnder(id){
  const f = folderById(id);
  const out = [];
  (function walk(n){ out.push(n.id); (n.children||[]).forEach(walk); })(f);
  return out;
}
function resourcesInFolder(folderId, includeSub=false){
  const ids = includeSub ? new Set(allFolderIdsUnder(folderId)) : new Set([folderId]);
  return Object.values(DATA.resources).filter(r => ids.has(r.folderId));
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<86400*30) return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
}
function toast(msg, icoName='check'){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = icon(icoName,14) + '<span>'+escapeHtml(msg)+'</span>';
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML;
}
function bytesToSize(bytes){
  if(!bytes) return '';
  const units=['B','KB','MB']; let i=0; let n=bytes;
  while(n>=1024 && i<units.length-1){ n/=1024; i++; }
  return n.toFixed(n<10&&i>0?1:0)+' '+units[i];
}

  const name = NAV_TO_TREE_NAME[navId];

  const nav = document.getElementById('navScroll');

    if(section.group){

      lbl.textContent = section.group;
      g.appendChild(lbl);

    section.items.forEach(item=>{

function resourceCardHtml(r){
  const tm = typeMeta(r.type);
  const isFav = DATA.favourites.includes(r.id);
  const revState = DATA.revision[r.id];
  const isMarked = revState && revState.marked;
  const revCount = (revState && revState.count) || 0;
  const refBadge = (tm.kind==='file' && r.fileRef && !r.fileData) ? `<span class="rc-badge-ref" title="Large file — stored as a reference, not embedded">reference</span>` : '';
  const revBadge = revCount ? `<span>·</span><span title="Times revised">${icon('revision',10)} ${revCount}</span>` : '';
  return `<div class="resource-card" data-id="${r.id}">
    <button class="rc-star ${isFav?'active':''}" title="Favourite">${icon(isFav?'starFilled':'star',15)}</button>

  </div>`;
}

function openResource(r){
  r.updatedAt = r.updatedAt; // keep updatedAt as edit time
  r.openedAt = Date.now();
  scheduleSaveData();
  const tm = typeMeta(r.type);
  if(tm.kind==='url'){
    if(r.url) window.open(r.url, '_blank', 'noopener');
    else toast('No link saved for this resource', 'other');
    return;
  }
  if(r.type==='image' && r.fileData){
    openImagePreview(r);
    return;
  }
  // file kind
  if(r.fileData){
    // embedded — open in new tab via data URL / blob
    try{
      const blob = dataURLtoBlob(r.fileData);
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank', 'noopener');
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
    }catch(e){
      toast('Could not open embedded file', 'other');
    }
  } else {
    // reference-only — ask user to locate file
    openLocateFileFlow(r);
  }
}
function dataURLtoBlob(dataUrl){
  const [meta, b64] = dataUrl.split(',');
  const mimeMatch = meta.match(/data:(.*);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
function openLocateFileFlow(r){
  const input = document.getElementById('hiddenFileInput');
  input.value = '';
  input.onchange = ()=>{
    const file = input.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    window.open(url, '_blank', 'noopener');
    toast('Opened '+file.name);
  };
  toast('This file is stored as a reference — pick it from your computer to open it', 'other');
  input.click();
}

/* ---------------------- IMAGE PREVIEW (prev / next) ---------------------- */
let previewState = { list: [], index: -1 };
function imageResourcesInFolder(folderId){
  return Object.values(DATA.resources)
    .filter(r=> r.folderId===folderId && r.type==='image' && r.fileData)
    .sort((a,b)=>b.updatedAt-a.updatedAt);
}
function openImagePreview(r){
  const siblings = imageResourcesInFolder(r.folderId);
  const idx = siblings.findIndex(s=>s.id===r.id);
  previewState = { list: siblings.length ? siblings : [r], index: idx<0 ? 0 : idx };
  renderPreview();
  document.getElementById('imagePreviewOverlay').classList.add('open');
}
function closeImagePreview(){ document.getElementById('imagePreviewOverlay').classList.remove('open'); }
function renderPreview(){
  const r = previewState.list[previewState.index];
  if(!r) return;
  document.getElementById('previewName').textContent = r.name;
  document.getElementById('previewImg').src = r.fileData || '';
  const isFav = DATA.favourites.includes(r.id);
  const favBtn = document.getElementById('previewFavBtn');
  favBtn.innerHTML = icon(isFav?'starFilled':'star',16);
  favBtn.classList.toggle('active', isFav);
  document.getElementById('previewPos').textContent = (previewState.index+1)+' / '+previewState.list.length;
  document.getElementById('previewPrevBtn').disabled = previewState.index<=0;
  document.getElementById('previewNextBtn').disabled = previewState.index>=previewState.list.length-1;
  r.openedAt = Date.now();
  scheduleSaveData();
}
document.getElementById('previewPrevBtn').onclick = ()=>{ if(previewState.index>0){ previewState.index--; renderPreview(); } };
document.getElementById('previewNextBtn').onclick = ()=>{ if(previewState.index<previewState.list.length-1){ previewState.index++; renderPreview(); } };
document.getElementById('previewCloseBtn').onclick = closeImagePreview;
document.getElementById('previewFavBtn').onclick = ()=>{
  const r = previewState.list[previewState.index];
  if(r){ toggleFavourite(r.id); renderPreview(); }
};
document.getElementById('previewOpenBtn').onclick = ()=>{
  const r = previewState.list[previewState.index];
  if(r && r.fileData){
    const blob = dataURLtoBlob(r.fileData);
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank', 'noopener');
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }
};
document.getElementById('imagePreviewOverlay').addEventListener('click', (e)=>{ if(e.target.id==='imagePreviewOverlay') closeImagePreview(); });
document.addEventListener('keydown', (e)=>{
  if(!document.getElementById('imagePreviewOverlay').classList.contains('open')) return;
  if(e.key==='ArrowLeft') document.getElementById('previewPrevBtn').click();
  else if(e.key==='ArrowRight') document.getElementById('previewNextBtn').click();
  else if(e.key==='Escape') closeImagePreview();
});

function toggleFavourite(id){
  const idx = DATA.favourites.indexOf(id);
  if(idx>=0) DATA.favourites.splice(idx,1); else DATA.favourites.push(id);

function toggleRevision(id){
  if(!DATA.revision[id]) DATA.revision[id] = {marked:false};
  DATA.revision[id].marked = !DATA.revision[id].marked;
  DATA.revision[id].markedAt = Date.now();
  scheduleSaveData();
  render();
}
function reviseResource(id){
  if(!DATA.revision[id]) DATA.revision[id] = {marked:false};
  DATA.revision[id].count = (DATA.revision[id].count||0) + 1;
  DATA.revision[id].lastRevisedAt = Date.now();
  scheduleSaveData();
  render();
  toast('Revision counted — '+DATA.revision[id].count+' total');
}
// Sums revision counts per subject and per folder/chapter, for the Revision tab.
function computeRevisionStats(){
  const perSubject = {'Physics':0,'Chemistry':0,'Botany':0,'Zoology':0};
  const perFolder = {};
  Object.entries(DATA.revision).forEach(([id, v])=>{
    const count = v.count||0;
    if(!count) return;
    const r = DATA.resources[id];
    if(!r) return;
    perFolder[r.folderId] = (perFolder[r.folderId]||0) + count;
    const path = findFolder(r.folderId);
    if(path && path.length){
      const subj = path[0].name;
      if(Object.prototype.hasOwnProperty.call(perSubject, subj)) perSubject[subj] += count;
    }
  });
  const folderRows = Object.entries(perFolder).map(([fid,count])=>{
    const path = findFolder(fid);
    return {
      fid, count,
      name: path ? path[path.length-1].name : 'Unknown',
      pathStr: path ? path.map(p=>p.name).join(' / ') : '',
    };
  }).sort((a,b)=>b.count-a.count).slice(0,8);
  return {perSubject, folderRows};
}

/* ---------------------- EXPORT / IMPORT ---------------------- */
function exportLibrary(){
  const payload = {
    exportedAt: new Date().toISOString(),
    schemaVersion: SCHEMA_VERSION,
    app: 'neet-library',
    data: DATA,
    settings: SETTINGS,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `neet-library-backup-${dateStr}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  SETTINGS.lastExportAt = Date.now();
  scheduleSaveSettings();
  toast('Library exported');
  if(STATE.view==='dashboard') render();
  else if(STATE.view==='settings') renderSettingsView(document.getElementById('content'));
}
function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(err){ toast('This file is not a valid backup (invalid JSON)', 'other'); return; }
    if(!parsed || parsed.app !== 'neet-library' || !parsed.data || !parsed.data.resources){
      toast('This file does not look like a NEET Library backup', 'other'); return;
    }
    showImportChoice(parsed);
  };
  reader.readAsText(file);
  e.target.value = '';
}
function showImportChoice(parsed){
  const incomingCount = Object.keys(parsed.data.resources||{}).length;

  document.getElementById('confirmBody').innerHTML =

  }
  cancelBtn.onclick = cleanup;
  okBtn.onclick = ()=>{ mergeImport(parsed); cleanup(); };

}
function mergeImport(parsed){
  // merge resources by id, skip duplicates; merge tree by name at top level, add new subfolders
  const incoming = parsed.data;
  let added = 0;
  Object.entries(incoming.resources||{}).forEach(([id,res])=>{
    if(!DATA.resources[id]){ DATA.resources[id] = res; added++; }
  });
  mergeTree(DATA.tree, incoming.tree||[]);
  (incoming.favourites||[]).forEach(id=>{ if(DATA.resources[id] && !DATA.favourites.includes(id)) DATA.favourites.push(id); });
  Object.entries(incoming.revision||{}).forEach(([id,v])=>{ if(DATA.resources[id] && !DATA.revision[id]) DATA.revision[id]=v; });
  scheduleSaveData();
  render();
  toast(`Merged — added ${added} new resource(s)`);
}
function mergeTree(existing, incoming){
  incoming.forEach(inNode=>{
    let match = existing.find(n=>n.name.toLowerCase()===inNode.name.toLowerCase());
    if(!match){
      existing.push(inNode);
    } else {
      match.children = match.children||[];
      mergeTree(match.children, inNode.children||[]);
    }
  });
}
function replaceImport(parsed){
  DATA = parsed.data;
  if(!DATA.version) DATA.version = SCHEMA_VERSION;
  if(parsed.settings) SETTINGS = parsed.settings;
  scheduleSaveData(); scheduleSaveSettings();
  applyTheme(SETTINGS.theme); applySidebarCollapsed(); document.body.setAttribute('data-density', SETTINGS.density);
  render();
  toast('Library replaced from backup');
}

/* ---------------------- BULK FOLDER IMPORT ---------------------- */
function extToType(ext){
  ext = (ext||'').toLowerCase();
  if(ext==='pdf') return 'pdf';
  if(['jpg','jpeg','png','gif','webp','bmp','svg','heic'].includes(ext)) return 'image';
  if(['html','htm'].includes(ext)) return 'html';
  if(['md','txt'].includes(ext)) return 'note';
  if(['doc','docx','rtf','odt','ppt','pptx','xls','xlsx','csv'].includes(ext)) return 'document';
  return 'other';
}
function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function ensureSubfolderPath(parentId, segments){
  let currentId = parentId;
  segments.forEach(seg=>{
    if(!seg) return;
    const parent = folderById(currentId);
    parent.children = parent.children || [];
    let match = parent.children.find(c=>c.name.toLowerCase()===seg.toLowerCase());
    if(!match){
      match = {id:'f_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+Math.random().toString(36).slice(2,4), name:seg, custom:true, children:[]};
      parent.children.push(match);
    }
    currentId = match.id;
  });
  return currentId;
}
function triggerFolderImport(targetFolderId){
  const input = document.getElementById('folderImportInput');
  input.dataset.target = targetFolderId;
  input.value = '';
  input.click();
}
document.getElementById('folderImportInput').addEventListener('change', async (e)=>{
  const targetFolderId = e.target.dataset.target;
  const files = Array.from(e.target.files).filter(f=> f.name && !f.name.startsWith('.') && f.name.toLowerCase()!=='thumbs.db');
  e.target.value = '';
  if(files.length===0){ toast('No usable files found in that folder', 'other'); return; }
  toast(`Importing ${files.length} file(s)…`, 'download');
  let embedded=0, referenced=0;
  const now0 = Date.now();
  for(const file of files){
    const relPath = file.webkitRelativePath || file.name;
    const parts = relPath.split('/');
    parts.pop();       // drop filename
    parts.shift();     // drop the top-level selected folder's own name
    const destFolderId = parts.length ? ensureSubfolderPath(targetFolderId, parts) : targetFolderId;
    const type = extToType(file.name.split('.').pop());
    let fileData = null, fileRef = null;
    if(file.size <= FILE_EMBED_LIMIT){
      try{ fileData = await readFileAsDataURL(file); embedded++; }
      catch(e){ fileRef = {name:file.name, size:file.size, type:file.type}; referenced++; }
    } else {
      fileRef = {name:file.name, size:file.size, type:file.type};
      referenced++;
    }
    const id = uid();
    const now = Date.now();
    DATA.resources[id] = {
      id, name: file.name.replace(/\.[^.]+$/,''), type, folderId: destFolderId, tags: [], notes:'',
      url: null, fileData, fileRef,
      createdAt: now, updatedAt: now, openedAt: null,
    };
  }
  scheduleSaveData();
  render();
  toast(`Imported ${files.length} file(s) — ${embedded} stored fully, ${referenced} kept as references`, 'check');
});

function deleteFolder(folderId){
  const idsUnder = new Set(allFolderIdsUnder(folderId));
  // remove resources under this folder tree
  Object.keys(DATA.resources).forEach(rid=>{
    if(idsUnder.has(DATA.resources[rid].folderId)){
      delete DATA.resources[rid];
      DATA.favourites = DATA.favourites.filter(id=>id!==rid);
      delete DATA.revision[rid];
    }
  });
  // remove the folder node from its parent's children (or top-level tree)
  function removeFrom(nodes){
    const idx = nodes.findIndex(n=>n.id===folderId);
    if(idx>=0){ nodes.splice(idx,1); return true; }
    for(const n of nodes){ if(n.children && removeFrom(n.children)) return true; }
    return false;
  }
  removeFrom(DATA.tree);
  scheduleSaveData();
  if(STATE.folderId===folderId || (idsUnder.has(STATE.folderId))){ STATE.view='dashboard'; STATE.folderId=null; }
  render();
}

let searchFilterType = 'all';
function openSearch(){
  document.getElementById('searchOverlay').classList.add('open');
  document.getElementById('searchInput').value='';
  document.getElementById('searchInput').focus();
  renderSearchFilters();
  runSearch('');
}
function closeSearch(){ document.getElementById('searchOverlay').classList.remove('open'); }
function renderSearchFilters(){
  const filters = ['all','pdf','image','link','video','html','document','formula','note'];
  const el = document.getElementById('searchFilters');
  el.innerHTML = filters.map(f=>`<div class="filter-chip ${searchFilterType===f?'active':''}" data-f="${f}">${f==='all'?'All types':typeMeta(f).label}</div>`).join('');
  el.querySelectorAll('.filter-chip').forEach(c=> c.onclick = ()=>{ searchFilterType = c.dataset.f; renderSearchFilters(); runSearch(document.getElementById('searchInput').value); });
}
function runSearch(q){
  q = q.trim().toLowerCase();
  let results = Object.values(DATA.resources);
  if(searchFilterType!=='all') results = results.filter(r=>r.type===searchFilterType);
  if(q){
    results = results.filter(r=>{
      const path = findFolder(r.folderId);
      const pathStr = path? path.map(p=>p.name).join(' ').toLowerCase() : '';
      return r.name.toLowerCase().includes(q) ||
        (r.tags||[]).some(t=>t.toLowerCase().includes(q)) ||
        pathStr.includes(q) ||
        (r.notes||'').toLowerCase().includes(q);
    });
  }
  results.sort((a,b)=>b.updatedAt-a.updatedAt);
  const el = document.getElementById('searchResults');
  if(results.length===0){
    el.innerHTML = `<div class="empty-state" style="padding:36px 10px;">${icon('search',26)}<h3>No matches</h3><p>Try a different search term or filter.</p></div>`;
    return;
  }
  el.innerHTML = results.slice(0,60).map(r=>{
    const tm = typeMeta(r.type);
    const path = findFolder(r.folderId);
    const pathStr = path? path.map(p=>p.name).join(' / ') : '';
    return `<div class="search-result" data-id="${r.id}">
      <div class="list-row-ico">${icon(tm.ico,13)}</div>
      <div style="flex:1; min-width:0;">
        <div class="list-row-name">${escapeHtml(r.name)}</div>
        <div class="sr-path">${escapeHtml(pathStr)}</div>
      </div>
      <div class="list-row-sub">${timeAgo(r.updatedAt)}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.search-result').forEach(row=>{
    row.onclick = ()=>{ closeSearch(); openResource(DATA.resources[row.dataset.id]); };
  });
}
document.getElementById('topbarSearch').onclick = openSearch;
document.getElementById('searchInput').addEventListener('input', (e)=> runSearch(e.target.value));
document.getElementById('searchOverlay').addEventListener('click', (e)=>{ if(e.target.id==='searchOverlay') closeSearch(); });

/* ---------------------- GLOBAL KEYS ---------------------- */
document.addEventListener('keydown', (e)=>{
  const overlayOpen = document.getElementById('searchOverlay').classList.contains('open');
  const typing = ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  const isCmdK = (e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k';
  if(isCmdK){
    e.preventDefault(); overlayOpen ? closeSearch() : openSearch();
  } else if(e.key==='/' && !overlayOpen && !typing){
    e.preventDefault(); openSearch();
  } else if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='n' && !overlayOpen && !typing){
    e.preventDefault(); openResourceModal({folderId: STATE.folderId || topFolderIdByName('Physics')});
  } else if(e.key==='Escape'){
    if(overlayOpen) closeSearch();
    document.querySelectorAll('.modal-overlay.open').forEach(m=>m.classList.remove('open'));
  }
});
// Mac vs other OS hint in the search bar and shortcut labels
(function setPlatformHints(){
  const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  const hint = document.getElementById('searchKbdHint');
  if(hint) hint.textContent = isMac ? '⌘K' : 'Ctrl K';
})();

/* ---------------------- SIDEBAR COLLAPSE / MOBILE ---------------------- */
document.getElementById('collapseBtn').onclick = ()=>{
  SETTINGS.sidebarCollapsed = !SETTINGS.sidebarCollapsed;
  applySidebarCollapsed();
  scheduleSaveSettings();
};
document.getElementById('mobileMenuBtn').onclick = ()=>{
  document.getElementById('appShell').classList.toggle('mobile-open');
};

/* ---------------------- INIT ---------------------- */
async function init(){
  await loadAll();
  document.body.setAttribute('data-theme', SETTINGS.theme);
  document.body.setAttribute('data-density', SETTINGS.density);
  applySidebarCollapsed();
  render();
  markSaved();
}
init();
</script>
</body>
